name: woosignal_shopify_api
description: Shopify API for Dart, connect a Shopify store on WooSignal and start using the API to get products, login, create orders and more.
version: 2.3.2
homepage: https://woosignal.com
repository: https://github.com/woosignal/flutter-shopify-api
issue_tracker: https://github.com/woosignal/flutter-shopify-api/issues
documentation: https://woosignal.com/docs/api/shopify/1.0/overview

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  dio: ^5.9.0
  nylo_support: ^6.35.1
  device_meta: ^2.1.9
  collection: ^1.19.1
  encrypt: ^5.0.3
  intl: ^0.20.2

  flutter:
    sdk: flutter

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
  flutter_test:
    sdk: flutter

screenshots:
  - description: The WooSignal package logo.
    path: screenshots/logo.png